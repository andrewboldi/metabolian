name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Validate pathway data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Schema + referential-integrity validation
        run: npm run data:validate
      - name: Unit tests
        run: npm test
      - name: Render molecule structures (build-time; gates must see the real corpus)
        run: npm run mol:build
      - name: Build master graph
        run: npm run data:build
      - name: Chart QA gates (routing, dangling arrows, cell overlap)
        run: node tools/qa-metrics.mjs --gate
      - name: Balance gate (every concrete reaction balances in mass + charge as stored)
        run: node tools/qa-balance.mjs --gate

  render:
    name: Rendered-output QA (overprints, strikethroughs, empty cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # Node 22: this job drives Chromium over a WebSocket, which is a global
        # only from v22. On 20 the harness has no transport at all.
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Serve and measure what actually paints
        run: |
          npx vite preview --port 4173 &
          npx wait-on -t 60000 http://localhost:4173/metabolian/chart.html
          node tools/qa-dom.mjs --gate
      - name: Render performance budget
        # The master chart renders ~7-9s to first cell on GitHub's 2-core runners
        # (442 nodes through a quadratic label placer). A 7000ms budget had no
        # margin for runner variance and flaked red ~half the time on commits that
        # touched no rendering code. 10000ms still catches a real regression while
        # tolerating jitter; metabolian-zzc tracks reclaiming the headroom so this
        # can drop back toward 7000ms.
        run: |
          node tools/render-perf.mjs --budget 4000 --master-budget 10000 _master glycolysis cholesterol-biosynthesis purine-de-novo-synthesis

  web:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

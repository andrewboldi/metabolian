name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates. GitHub merges
# them (squashed) once the checks the main-branch ruleset requires have passed:
# CI's data validation, rendered-output QA, and lint/typecheck/build. Major
# updates wait for a person.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'andrewboldi/metabolian'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
